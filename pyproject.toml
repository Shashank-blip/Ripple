[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ripple-tia"
version = "0.1.0"
description = "Test impact analysis for Python repos: run only the tests a diff can affect."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ripple = "ripple.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]